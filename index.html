<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinew & Seed">
<meta name="theme-color" content="#070605">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sinew &amp; Seed</title>
<style>html,body{margin:0;height:100%;background:#070605;color:#e6c98a;font:16px Georgia,serif}
#m{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}</style>
</head><body><div id="m">Loading…</div>
<script>
(async function(){
  var m=document.getElementById('m');
  function fail(t){m.textContent=t;}
  try{
    var h=location.hash.slice(1), k=h||localStorage.getItem('ssk')||'';
    if(!k) return fail('This is a private link. Open it from the full address you were sent.');
    var b=k.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    var raw=Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)});
    var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    var r=await fetch('game.bin',{cache:'no-cache'}); if(!r.ok) throw new Error('download '+r.status);
    var buf=new Uint8Array(await r.arrayBuffer());
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
    var html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    try{localStorage.setItem('ssk',k);}catch(e){}
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
    document.open(); document.write(html); document.close();
  }catch(e){ fail('Could not open the game ('+(e&&e.name||e)+'). Check the link is complete.'); }
})();
</script></body></html>
